# Single-worker prefork, no keep-alive. This makes the cross-request chain
# deterministic for teaching. The stock 150-worker config also works; see the
# README for the --workers 150 variant.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
